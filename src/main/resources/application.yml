server:
  port: 9090

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: springboot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

sky:
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    accessKeyId: ${ALIOSS_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucketName: ${ALIOSS_BUCKET_NAME:iblog-file}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
